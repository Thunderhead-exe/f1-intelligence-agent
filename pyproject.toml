[project]
name = "f1-intelligence-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "thunderhead.exe", email = "ademsalahbk@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastf1>=3.8.3",
    "gradio>=6.14.0",
    "langchain>=1.3.1",
    "langchain-openai>=1.2.1",
    "langgraph>=1.2.0",
    "numpy>=2.4.6",
    "openai>=2.37.0",
    "pandas>=2.3.3",
    "plotly>=6.7.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.8.0",
    "tavily-python>=0.7.24",
]

[project.scripts]
f1-intelligence-agent = "f1_intelligence_agent:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
